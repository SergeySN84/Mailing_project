<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сервис рассылок</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        .btn {
            display: inline-block;
            padding: 5px 10px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 5px 5px 5px 0;
        }
        .btn-danger { background: #cc0000; }
        .alert {
            padding: 10px;
            margin: 10px 0;
            background: #e0f7fa;
            border-left: 4px solid #0066cc;
        }
    </style>
</head>
<body>

<nav>
    {% if user.is_authenticated %}
        <a href="{% url 'mailings:mailing_list' %}">Рассылки</a>
        <a href="{% url 'mailings:client_list' %}">Получатели</a>
        <a href="{% url 'mailings:message_list' %}">Сообщения</a>
        <a href="{% url 'mailings:attempt_list' %}">Попытки</a>
        <a href="{% url 'users:profile' %}">Профиль</a>
        <a href="{% url 'users:logout' %}" class="btn">Выход</a>
    {% else %}
        <a href="{% url 'users:login' %}">Вход</a>
        <a href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>

<main>
    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
