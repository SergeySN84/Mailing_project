{% extends 'base.html' %}

{% block content %}
<h2>{% if object %}Редактировать сообщение{% else %}Создать сообщение{% endif %}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">
    {% if object %}Сохранить{% else %}Создать{% endif %}
  </button>
  <a href="{% url 'mailings:message_list' %}">Отмена</a>
</form>
{% endblock %}
